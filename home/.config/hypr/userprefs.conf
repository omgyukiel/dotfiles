# Vim-style window navigation.
#
# HyDE already used:
#   SUPER + J = toggle split
#   SUPER + K = toggle keyboard layout
#   SUPER + L = lock screen
#
# These unbinds let SUPER + H/J/K/L behave like Vim directions.
# The original actions are re-bound nearby:
#   SUPER + Alt + J = toggle split
#   SUPER + Alt + K = toggle keyboard layout
#   SUPER + Alt + L = lock screen
unbind = $mainMod, J
unbind = $mainMod, K
unbind = $mainMod, L

bindd = $mainMod, H, [Window Management|Change focus|Vim] focus left, movefocus, l
bindd = $mainMod, J, [Window Management|Change focus|Vim] focus down, movefocus, d
bindd = $mainMod, K, [Window Management|Change focus|Vim] focus up, movefocus, u
bindd = $mainMod, L, [Window Management|Change focus|Vim] focus right, movefocus, r

$vim_moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = $mainMod Shift, H, [Window Management|Move active window across workspace|Vim] move active window left, exec, $vim_moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = $mainMod Shift, J, [Window Management|Move active window across workspace|Vim] move active window down, exec, $vim_moveactivewindow 0 30 || hyprctl dispatch movewindow d
bindde = $mainMod Shift, K, [Window Management|Move active window across workspace|Vim] move active window up, exec, $vim_moveactivewindow 0 -30 || hyprctl dispatch movewindow u
bindde = $mainMod Shift, L, [Window Management|Move active window across workspace|Vim] move active window right, exec, $vim_moveactivewindow 30 0 || hyprctl dispatch movewindow r

bindd = $mainMod, R, [Window Management|Resize Active Window|Vim] enter resize mode, submap, resize
submap = resize
bindde = , H, resize window left, resizeactive, -30 0
bindde = , J, resize window down, resizeactive, 0 30
bindde = , K, resize window up, resizeactive, 0 -30
bindde = , L, resize window right, resizeactive, 30 0
bindd = , escape, exit resize mode, submap, reset
bindd = , Q, exit resize mode, submap, reset
bindd = , return, exit resize mode, submap, reset
submap = reset

bindd = $mainMod Alt, J, [Window Management] toggle split, layoutmsg, togglesplit
binddl = $mainMod Alt, K, [Utilities] toggle keyboard layout, exec, hyde-shell keyboardswitch
bindd = $mainMod Alt, L, [Window Management] lock screen, exec, hyde-shell lock-session
bindd = $mainMod Alt, M, [Media] open media control menu, exec, pkill -x rofi || media-menu

# Group mode for moving windows into/out of nearby groups.
#
# Usage:
#   SUPER + CTRL + G  enter group mode
#   H/J/K/L           move window or group it left/down/up/right
#   O                 move the active window out of its group
#   T                 lock/unlock the active group
#   q/Escape/Enter    exit group mode
#
# movewindoworgroup behaves like moveintogroup when there is a group in the
# chosen direction, like moveoutofgroup when appropriate, otherwise movewindow.
bindd = $mainMod Control, G, [Window Management|Group Mode] enter group mode, submap, group
submap = group
bindd = , H, move/group window left, movewindoworgroup, l
bindd = , J, move/group window down, movewindoworgroup, d
bindd = , K, move/group window up, movewindoworgroup, u
bindd = , L, move/group window right, movewindoworgroup, r
bindd = , O, move active window out of group, moveoutofgroup
bindd = , T, toggle active group lock, lockactivegroup, toggle
bindd = , Q, exit group mode, submap, reset
bindd = , escape, exit group mode, submap, reset
bindd = , return, exit group mode, submap, reset
submap = reset
