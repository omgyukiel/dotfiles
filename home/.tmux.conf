# Vim-style copy mode for tmux.
#
# Usage:
#   Ctrl-b [  enter copy mode
#   h/j/k/l   move cursor
#   v         start selection
#   y         copy selection to Wayland clipboard and exit copy mode
#   q         exit copy mode

set -g mouse on
setw -g mode-keys vi

# Easier pane splits. These use visual separators:
#   Ctrl-b |  side-by-side panes
#   Ctrl-b -  top/bottom panes
bind-key | split-window -h
bind-key - split-window -v

# Vim-style pane focus. Prefix-based bindings avoid conflicts with shells,
# Vim, Neovim, and future LazyVim config.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Fast pane focus without prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi q send -X cancel
